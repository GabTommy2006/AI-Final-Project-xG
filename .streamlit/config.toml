[server]
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#123D34"
backgroundColor = "#F5F5EF"
secondaryBackgroundColor = "#E8ECE5"
textColor = "#183B33"
font = "Manrope, sans-serif"
headingFont = "Manrope, sans-serif"

[[theme.fontFaces]]
family = "Manrope"
url = "app/static/Manrope.ttf"
weight = "200 800"
style = "normal"
